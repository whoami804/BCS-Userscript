name: Publish beta userscript

on:
  push:
    paths:
      - 'patches/rc9-to-rc10.patch.gz.b64'
      - '.github/workflows/publish-beta.yml'
  pull_request:
    paths:
      - 'patches/rc9-to-rc10.patch.gz.b64'
      - '.github/workflows/publish-beta.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Patch and validate beta userscript
        shell: bash
        run: |
          echo '943961555fcdb03bb51fc944c707ea8cc1b959729d4cb7d3f913c6df2db6d2ee  control-suite-boosteroid-beta.user.js' | sha256sum -c -
          base64 -d patches/rc9-to-rc10.patch.gz.b64 | gzip -d > /tmp/rc9-to-rc10.patch
          cp control-suite-boosteroid-beta.user.js /tmp/beta-next.user.js
          patch --batch /tmp/beta-next.user.js < /tmp/rc9-to-rc10.patch
          echo '8dc3efa444592403db886fb999c6ee983361c5f961604ee76c121c8befd4863e  /tmp/beta-next.user.js' | sha256sum -c -
          node --check /tmp/beta-next.user.js
          mv /tmp/beta-next.user.js control-suite-boosteroid-beta.user.js

      - name: Publish fixed beta URL
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control-suite-boosteroid-beta.user.js
          if git diff --cached --quiet; then
            echo 'No distribution change.'
            exit 0
          fi
          git commit -m 'Publish v0.8.1-rc10 beta userscript'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
