name: Publish beta userscript

on:
  push:
    paths:
      - 'dist-src/**'
      - '.github/workflows/publish-beta.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch and validate beta userscript
        shell: bash
        run: |
          echo '655d6b9b933ce899df223459bac20d71f4fdcf760511a231090758dfcdf13e11  control-suite-boosteroid-beta.user.js' | sha256sum -c -
          base64 -d dist-src/rc2-to-rc3.patch.gz.b64 | gzip -d > /tmp/rc2-to-rc3.patch
          cp control-suite-boosteroid-beta.user.js /tmp/beta-next.user.js
          patch --batch /tmp/beta-next.user.js < /tmp/rc2-to-rc3.patch
          echo 'd4241c8ee48d88cb795072d0108c66e58980c0c7e378220fded9b8cbe912129d  /tmp/beta-next.user.js' | sha256sum -c -
          node --check /tmp/beta-next.user.js
          mv /tmp/beta-next.user.js control-suite-boosteroid-beta.user.js

      - name: Publish fixed beta URL
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control-suite-boosteroid-beta.user.js
          if git diff --cached --quiet; then
            echo 'No distribution change.'
            exit 0
          fi
          git commit -m 'Publish v0.8.1-rc3 beta userscript'
          git push
