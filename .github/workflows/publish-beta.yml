name: Publish beta userscript

on:
  push:
    paths:
      - 'patches/rc6-to-rc7.patch.gz.b64'
      - '.github/workflows/publish-beta.yml'
  pull_request:
    paths:
      - 'patches/rc6-to-rc7.patch.gz.b64'
      - '.github/workflows/publish-beta.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Patch and validate beta userscript
        shell: bash
        run: |
          echo '347452b473adf799c38c136a42eb8306bfcb9f5276a4e93eb727b2d2bb42b605  control-suite-boosteroid-beta.user.js' | sha256sum -c -
          base64 -d patches/rc6-to-rc7.patch.gz.b64 | gzip -d > /tmp/rc6-to-rc7.patch
          cp control-suite-boosteroid-beta.user.js /tmp/beta-next.user.js
          patch --batch /tmp/beta-next.user.js < /tmp/rc6-to-rc7.patch
          echo 'cd73fbb5c3c35e272bbf420b8b908702c247977fb0e3533be9014d1ec94dd17e  /tmp/beta-next.user.js' | sha256sum -c -
          node --check /tmp/beta-next.user.js
          mv /tmp/beta-next.user.js control-suite-boosteroid-beta.user.js

      - name: Publish fixed beta URL
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control-suite-boosteroid-beta.user.js
          if git diff --cached --quiet; then
            echo 'No distribution change.'
            exit 0
          fi
          git commit -m 'Publish v0.8.1-rc7 beta userscript'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
