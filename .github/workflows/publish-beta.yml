name: Publish beta userscript

on:
  push:
    paths:
      - 'patches/rc4-to-rc5.patch.gz.b64'
      - '.github/workflows/publish-beta.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch and validate beta userscript
        shell: bash
        run: |
          echo '2ee126e6ec94bb7a66ac08d525838b926c9ac57eeecce31c7def7f1e82861727  control-suite-boosteroid-beta.user.js' | sha256sum -c -
          base64 -d patches/rc4-to-rc5.patch.gz.b64 | gzip -d > /tmp/rc4-to-rc5.patch
          cp control-suite-boosteroid-beta.user.js /tmp/beta-next.user.js
          patch --batch /tmp/beta-next.user.js < /tmp/rc4-to-rc5.patch
          echo 'bf67829de2b96789a4d19648fca8d152f92d685dff4198c8435f22326e4cf903  /tmp/beta-next.user.js' | sha256sum -c -
          node --check /tmp/beta-next.user.js
          mv /tmp/beta-next.user.js control-suite-boosteroid-beta.user.js

      - name: Publish fixed beta URL
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control-suite-boosteroid-beta.user.js
          if git diff --cached --quiet; then
            echo 'No distribution change.'
            exit 0
          fi
          git commit -m 'Publish v0.8.1-rc5 beta userscript'
          git push
