name: Publish beta userscript

on:
  push:
    paths:
      - 'tools/build-rc18.py'
      - 'payloads/rc18/**'
      - '.github/workflows/publish-beta.yml'
  pull_request:
    paths:
      - 'tools/build-rc18.py'
      - 'payloads/rc18/**'
      - '.github/workflows/publish-beta.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Build and validate beta userscript
        shell: bash
        run: |
          echo 'e077fb5f43a923eef8aca4668386805e941e4521e08e7aa302edfc5c56f26233  control-suite-boosteroid-beta.user.js' | sha256sum -c -
          python tools/build-rc18.py /tmp/beta-next.user.js
          echo '030081a953990a1c66276fee272be3dd35f1b4d45f21dfd4682be5905f355b9a  /tmp/beta-next.user.js' | sha256sum -c -
          node --check /tmp/beta-next.user.js
          grep -q '^// @version      0.8.1-rc18$' /tmp/beta-next.user.js
          mv /tmp/beta-next.user.js control-suite-boosteroid-beta.user.js

      - name: Publish fixed beta URL
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control-suite-boosteroid-beta.user.js
          if git diff --cached --quiet; then
            echo 'No distribution change.'
            exit 0
          fi
          git commit -m 'Publish v0.8.1-rc18 beta userscript'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
