name: Publish beta userscript

on:
  push:
    paths:
      - 'patches/rc5-to-rc6.patch.gz.b64'
      - '.github/workflows/publish-beta.yml'
  pull_request:
    paths:
      - 'patches/rc5-to-rc6.patch.gz.b64'
      - '.github/workflows/publish-beta.yml'
      - 'triggers/rc6-direct-publish.txt'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Patch and validate beta userscript
        shell: bash
        run: |
          echo 'bf67829de2b96789a4d19648fca8d152f92d685dff4198c8435f22326e4cf903  control-suite-boosteroid-beta.user.js' | sha256sum -c -
          base64 -d patches/rc5-to-rc6.patch.gz.b64 | gzip -d > /tmp/rc5-to-rc6.patch
          cp control-suite-boosteroid-beta.user.js /tmp/beta-next.user.js
          patch --batch /tmp/beta-next.user.js < /tmp/rc5-to-rc6.patch
          echo '347452b473adf799c38c136a42eb8306bfcb9f5276a4e93eb727b2d2bb42b605  /tmp/beta-next.user.js' | sha256sum -c -
          node --check /tmp/beta-next.user.js
          mv /tmp/beta-next.user.js control-suite-boosteroid-beta.user.js

      - name: Commit RC6 onto current branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control-suite-boosteroid-beta.user.js
          if git diff --cached --quiet; then
            echo 'No distribution change.'
            exit 0
          fi
          git commit -m 'Publish v0.8.1-rc6 beta userscript'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
